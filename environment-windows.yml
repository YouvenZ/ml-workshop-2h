# Authoring environment for WINDOWS.
#
#   conda env create -f environment-windows.yml
#   conda activate mlws2h
#
# Identical to environment.yml; kept as a separate file so the setup scripts
# stay symmetrical with the four-hour version. poppler is listed explicitly:
# on Windows nothing else provides pdftocairo/pdftoppm, and the diagram build
# needs both.
name: mlws2h
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - nbformat
  - nbclient
  - ipykernel
  - pyyaml
  - poppler
