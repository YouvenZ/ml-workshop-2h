name: Publish the 2-hour workshop to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Catches the two things most likely to break a workshop silently:
  # a notebook hand-edited out of sync with its generator, and a hosted
  # dataset URL that has gone down since the last run.
  verify-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install numpy pandas matplotlib seaborn scikit-learn nbformat nbclient ipykernel

      - name: Notebooks match their generator
        run: |
          python tools/build_notebooks.py
          git diff --exit-code --stat notebooks/ \
            || { echo "::error::notebooks/ is out of sync — edit tools/build_notebooks.py and re-run it, never the .ipynb files"; exit 1; }

      - name: Every solution cell still runs
        run: python tools/check_notebooks.py

  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The deck declares engine: jupyter. The in-slide cells are Pyodide and
      # run in the browser, so nothing heavier than jupyter is needed here.
      # Extensions are committed under slides/_extensions/, and the clips and
      # diagrams under assets/rendered/, so CI needs neither LaTeX nor Manim.
      - name: Install Python deps
        run: pip install jupyter

      - name: Render site
        run: quarto render

      # check_assets.py measures clip durations with ffprobe.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Check every asset is present and within budget
        run: python tools/check_assets.py

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push'
    needs: [build-deploy, verify-notebooks]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
