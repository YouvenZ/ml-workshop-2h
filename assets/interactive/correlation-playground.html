<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Correlation playground</title>
<style>
  /* Palette identical to the slides, the TikZ diagrams and the Manim clips. */
  :root{
    --navy:#1B2A4A; --blue:#2E5CA8; --orange:#E07A2C;
    --teal:#2A9D8F; --gray:#D9DCE1; --bg:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font:15px/1.45 Inter,"Helvetica Neue",Arial,sans-serif;
    color:var(--navy); background:var(--bg);
    display:flex; align-items:center; justify-content:center;
  }
  .wrap{display:flex; gap:22px; align-items:stretch; padding:14px; max-width:920px; width:100%}
  .plot{flex:1 1 auto; min-width:0}
  svg{width:100%; height:auto; display:block; touch-action:none; cursor:crosshair}
  .side{flex:0 0 220px; display:flex; flex-direction:column; gap:12px; justify-content:center}

  .rbox{border:2px solid var(--gray); border-radius:8px; padding:12px 14px; text-align:center}
  .rlabel{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#6b7689}
  .rvalue{font-size:40px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums}
  .rword{font-size:14px; font-weight:600; margin-top:2px}

  .meter{height:8px; border-radius:4px; background:var(--gray); position:relative; overflow:hidden; margin-top:10px}
  .meter i{position:absolute; top:0; bottom:0; background:var(--blue); transition:none}

  button{
    font:inherit; font-size:13px; color:var(--navy); background:#fff;
    border:1.5px solid var(--gray); border-radius:6px; padding:7px 9px; cursor:pointer;
    text-align:left;
  }
  button:hover{border-color:var(--blue); color:var(--blue)}
  .hint{font-size:12.5px; color:#6b7689; line-height:1.4}
  .dot{fill:var(--blue); cursor:grab}
  .dot:active{cursor:grabbing}
  .dot.drag{fill:var(--orange)}
  @media (max-width:700px){ .wrap{flex-direction:column} .side{flex:auto} }
</style>
</head>
<body>
<div class="wrap">
  <div class="plot">
    <svg id="svg" viewBox="0 0 520 380" role="img" aria-label="Draggable scatter plot">
      <!-- axes -->
      <line x1="52" y1="330" x2="496" y2="330" stroke="#1B2A4A" stroke-width="2"/>
      <line x1="52" y1="330" x2="52"  y2="24"  stroke="#1B2A4A" stroke-width="2"/>
      <text x="274" y="366" text-anchor="middle" font-size="14" fill="#1B2A4A">flipper length</text>
      <text x="18" y="177" text-anchor="middle" font-size="14" fill="#1B2A4A"
            transform="rotate(-90 18 177)">body mass</text>
      <line id="fit" stroke="#E07A2C" stroke-width="2.5" stroke-dasharray="6 5" opacity="0"/>
      <g id="dots"></g>
    </svg>
  </div>

  <div class="side">
    <div class="rbox">
      <div class="rlabel">correlation r</div>
      <div class="rvalue" id="rval">0.00</div>
      <div class="rword" id="rword">no relationship</div>
      <div class="meter"><i id="bar"></i></div>
    </div>

    <button data-preset="strong">Strong positive</button>
    <button data-preset="weak">Weak / noisy</button>
    <button data-preset="negative">Negative</button>
    <button data-preset="curve">Curved &mdash; but r &asymp; 0</button>

    <p class="hint">
      Drag any point. <b>r</b> only measures how well a <b>straight line</b>
      fits &mdash; try the curved preset and watch r say &ldquo;nothing here&rdquo;
      about an obvious pattern.
    </p>
  </div>
</div>

<script>
(function(){
  const svg  = document.getElementById('svg');
  const gDots= document.getElementById('dots');
  const fit  = document.getElementById('fit');
  const X0=52, X1=496, Y0=330, Y1=24;          // plot area in SVG units

  const PRESETS = {
    // Noise tuned so this lands near r = 0.87 — the same value students
    // compute for flipper length vs body mass. A textbook-perfect 0.99
    // would teach them the wrong thing about what "strong" looks like.
    strong:   n => Array.from({length:n}, (_,i)=>{
                 const t=i/(n-1); return [t, 0.12+0.76*t + (Math.random()-.5)*0.50]; }),
    weak:     n => Array.from({length:n}, ()=>[Math.random(), Math.random()]),
    negative: n => Array.from({length:n}, (_,i)=>{
                 const t=i/(n-1); return [t, 0.88-0.74*t + (Math.random()-.5)*0.16]; }),
    // A parabola: an unmistakable pattern that Pearson's r scores at ~0.
    // This is the whole reason the widget exists.
    curve:    n => Array.from({length:n}, (_,i)=>{
                 const t=i/(n-1); return [t, 0.9-3.1*Math.pow(t-0.5,2) + (Math.random()-.5)*0.05]; }),
  };

  // Presets add noise around a trend line, which can push a point outside
  // [0,1] and draw it off the axes. Dragging is already clamped; generated
  // points must be too.
  const clamp01 = v => Math.max(0, Math.min(1, v));
  const makePreset = name => PRESETS[name](14).map(([x,y]) => [clamp01(x), clamp01(y)]);

  let pts = makePreset('strong');

  const sx = x => X0 + x*(X1-X0);
  const sy = y => Y0 + y*(Y1-Y0);
  const ix = px => (px-X0)/(X1-X0);
  const iy = py => (py-Y0)/(Y1-Y0);

  function pearson(p){
    const n=p.length;
    const mx=p.reduce((s,d)=>s+d[0],0)/n, my=p.reduce((s,d)=>s+d[1],0)/n;
    let sxy=0, sxx=0, syy=0;
    for(const [x,y] of p){ const a=x-mx, b=y-my; sxy+=a*b; sxx+=a*a; syy+=b*b; }
    const d=Math.sqrt(sxx*syy);
    return d < 1e-9 ? 0 : sxy/d;
  }

  function describe(r){
    const a=Math.abs(r);
    const dir = r>0 ? 'positive' : 'negative';
    if(a<0.15) return ['no relationship','#6b7689'];
    if(a<0.40) return ['weak '+dir, '#6b7689'];
    if(a<0.70) return ['moderate '+dir, r>0?'#2E5CA8':'#E07A2C'];
    if(a<0.90) return ['strong '+dir,   r>0?'#2E5CA8':'#E07A2C'];
    return ['very strong '+dir, r>0?'#2E5CA8':'#E07A2C'];
  }

  function drawFitLine(){
    const n=pts.length;
    const mx=pts.reduce((s,d)=>s+d[0],0)/n, my=pts.reduce((s,d)=>s+d[1],0)/n;
    let sxy=0,sxx=0;
    for(const [x,y] of pts){ sxy+=(x-mx)*(y-my); sxx+=(x-mx)*(x-mx); }
    if(sxx<1e-9){ fit.setAttribute('opacity',0); return; }
    const b=sxy/sxx, a=my-b*mx;
    fit.setAttribute('x1',sx(0));  fit.setAttribute('y1',sy(a));
    fit.setAttribute('x2',sx(1));  fit.setAttribute('y2',sy(a+b));
    fit.setAttribute('opacity',0.85);
  }

  function render(){
    gDots.innerHTML='';
    pts.forEach((p,i)=>{
      const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx',sx(p[0])); c.setAttribute('cy',sy(p[1]));
      c.setAttribute('r',8); c.setAttribute('class','dot'); c.dataset.i=i;
      gDots.appendChild(c);
    });
    drawFitLine();

    const r=pearson(pts);
    const [word,color]=describe(r);
    document.getElementById('rval').textContent = (r<0?'−':'')+Math.abs(r).toFixed(2);
    document.getElementById('rval').style.color = color;
    document.getElementById('rword').textContent = word;
    document.getElementById('rword').style.color = color;
    const bar=document.getElementById('bar');
    bar.style.width = (Math.abs(r)*100)+'%';
    bar.style.background = color;
  }

  // --- dragging (pointer events cover mouse, touch and pen) --------------
  let dragging=null;
  function toLocal(e){
    const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  svg.addEventListener('pointerdown', e=>{
    if(!e.target.classList.contains('dot')) return;
    dragging=+e.target.dataset.i;
    e.target.classList.add('drag');
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', e=>{
    if(dragging===null) return;
    const l=toLocal(e);
    pts[dragging]=[
      Math.max(0,Math.min(1, ix(l.x))),
      Math.max(0,Math.min(1, iy(l.y)))
    ];
    render();
    const el=gDots.querySelector(`[data-i="${dragging}"]`);
    if(el) el.classList.add('drag');
  });
  ['pointerup','pointercancel'].forEach(ev=>
    svg.addEventListener(ev, ()=>{ dragging=null; render(); }));

  document.querySelectorAll('[data-preset]').forEach(b=>
    b.addEventListener('click',()=>{ pts=makePreset(b.dataset.preset); render(); }));

  render();
})();
</script>
</body>
</html>
