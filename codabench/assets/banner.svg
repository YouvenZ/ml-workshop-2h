    <text x="80" y="306" font-size="92" font-weight="800" fill="#FFFFFF">Who Survives?</text>
    <text x="84" y="362" font-size="27" font-weight="400" fill="#C9D3E6">Train a model on 712 passengers. Predict 179 you have never seen.</text>
